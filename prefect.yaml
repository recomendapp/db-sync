# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: db-sync
prefect-version: 3.4.12

# build section allows you to manage and build docker images
build:

# push section allows you to manage if and how this project is uploaded to remote locations
push:

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
- prefect.deployments.steps.git_clone:
    id: db-sync # a user-provided identifier for this step
    repository: https://github.com/recomendapp/db-sync.git
    branch: main
    credentials: '{{ prefect.blocks.github-credentials.github-credentials }}'

x-job-variables: &job_variables
  env:
    EXTRA_PIP_PACKAGES: more_itertools psycopg2-binary pandas typesense


# the deployments section allows you to provide configuration for deploying flows
deployments:
- name: sync_tmdb
  version: 1.0.0
  tags:
  - tmdb
  description: Sync TMDB data
  schedules:
  - cron: 0 12 * * *
    timezone: Europe/Paris
    day_or: true
    active: true
  entrypoint: sync_tmdb/sync_tmdb.py:sync_tmdb
  parameters: {}
  work_pool:
    name: kube
    job_variables:
      <<: *job_variables
      # Mesuré sur le run du 2026-11-02 (1h48, 315 relevés via metrics-server) :
      # pic mémoire 2448 Mi, p90 2415, médiane 1811 — la conso monte par
      # paliers à chaque phase et se libère entre deux, sans fuite (+34 Mi
      # sur les 20 dernières minutes). 3Gi = pic + 25 %.
      # Les 6Gi précédents ne tenaient sur aucun nœud et déclenchaient un
      # scale-up Hetzner payant à chaque run quotidien.
      memory_request: "3Gi"
      memory_limit: "4Gi"
      # 2259m au pic, médiane 750m : inactif la plupart du temps, en attente
      # des API TMDB. L'ancien request de 2 était dépassé aux pics.
      cpu_request: "2500m"
      cpu_limit: "4"
    work_queue_name:
  concurrency_limit:
  enforce_parameter_schema: true

- name: sync_typesense
  version: 1.0.0
  tags:
  - typesense
  description: Sync all Typesense collections (movies, tv_series, persons, playlists, users)
  schedules: []
  entrypoint: sync_typesense/sync_typesense.py:sync_typesense
  parameters: {}
  work_pool:
    name: kube
    job_variables:
      <<: *job_variables
      # Pas encore mesuré, mais borné par construction : les cinq flows
      # streament via un curseur serveur nommé et traitent par lots de
      # BATCH_SIZE=10000, donc la table entière n'est jamais en mémoire.
      # Le seul poste qui grossit avec les données, ce sont les deux sets
      # d'IDs comparés dans delete_stale_documents (~100-200 Mo au million).
      # Le request est bas parce que c'est lui qui bloque le scheduling ;
      # le limit reste large parce que c'est lui qui protège de l'OOM.
      # À resserrer après une mesure, comme pour sync_tmdb.
      memory_request: "1500Mi"
      memory_limit: "4Gi"
      # Dominé par les attentes réseau (lectures Postgres, upserts HTTP vers
      # Typesense), pas par le calcul.
      cpu_request: "1"
      cpu_limit: "4"
  work_queue_name:
  concurrency_limit:
  enforce_parameter_schema: true

- name: generate_sitemaps
  version: 1.0.0
  tags:
  - sitemap
  description: Generate sitemaps
  schedules:
  - cron: 0 4 * * *
    timezone: Europe/Paris
    day_or: true
    active: true
  entrypoint: generate_sitemaps/generate_sitemaps.py:generate_sitemaps
  parameters: {}
  work_pool:
    name: kube
    job_variables:
      env:
        EXTRA_PIP_PACKAGES: psycopg2-binary boto3
      memory_request: "2Gi"
      cpu_request: "1"
      memory_limit: "3Gi"
      cpu_limit: "2"
    work_queue_name:
  concurrency_limit:
  enforce_parameter_schema: true

- name: run_import
  version: 1.0.0
  tags:
  - imports
  description: Parse and stage a user-uploaded provider export (Letterboxd, ...) for review
  schedules: []
  entrypoint: import_transfer/run_import.py:run_import
  parameters: {}
  work_pool:
    name: kube
    job_variables:
      env:
        EXTRA_PIP_PACKAGES: psycopg2-binary pandas boto3 requests typesense
      memory_request: "1Gi"
      cpu_request: "500m"
      memory_limit: "2Gi"
      cpu_limit: "1"
    work_queue_name:
  concurrency_limit: 5
  enforce_parameter_schema: true